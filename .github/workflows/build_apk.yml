name: Debug Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  debug-build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo root & files
        run: |
          echo "PWD: $(pwd)"
          echo "List root:"
          ls -la
          echo "Show pubspec.yaml (if present):"
          if [ -f pubspec.yaml ]; then
            sed -n '1,200p' pubspec.yaml || true
          else
            echo "pubspec.yaml not found"
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Flutter doctor (verbose) and environment
        run: |
          flutter --version || true
          flutter doctor -v || true
          echo
          echo "JAVA_HOME: $JAVA_HOME"
          echo "ANDROID_HOME / ANDROID_SDK_ROOT:"
          echo $ANDROID_SDK_ROOT
          echo $ANDROID_HOME

      - name: Show android/ presence and list gradle files
        run: |
          if [ -d "android" ]; then
            echo "android/ exists. Listing:"
            ls -la android || true
            echo "Listing android/app/src/main:"
            ls -la android/app/src/main || true
            echo "Listing android/gradle wrapper:"
            ls -la android/gradle || true
            echo "Show gradle-wrapper.properties if present:"
            if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
              sed -n '1,200p' android/gradle/wrapper/gradle-wrapper.properties || true
            fi
          else
            echo "android/ NOT found"
          fi

      - name: Attempt to generate android/ (only if missing) and capture output
        run: |
          mkdir -p ci-logs
          if [ ! -d "android" ]; then
            echo "Running: flutter create -t app . (will generate android/ on runner)"
            flutter create -t app . 2>&1 | tee ci-logs/flutter_create.log || true
          else
            echo "Skipping flutter create because android/ exists"
          fi
          echo "Contents after generation:"
          ls -la || true
          ls -la android || true

      - name: Dependencies (capture)
        run: |
          flutter pub get 2>&1 | tee ci-logs/pub_get.log || true

      - name: Build APK (capture full logs)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee ci-logs/build_apk.log || true

      - name: Build AAB (capture full logs)
        run: |
          flutter build appbundle --release 2>&1 | tee ci-logs/build_aab.log || true

      - name: Show build outputs & sizes
        run: |
          echo "Listing build/app/outputs/flutter-apk:"
          ls -la build/app/outputs/flutter-apk || true
          echo
          echo "Listing build/app/outputs/bundle/release:"
          ls -la build/app/outputs/bundle/release || true
          echo
          echo "Find any .apk or .aab under build/:"
          find build -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" \) -print -exec ls -lh {} \; || true
          echo
          echo "Build directory summary:"
          du -sh build || true

      - name: Package logs + build outputs for artifact
        run: |
          mkdir -p artifacts
          # collect logs
          cp -r ci-logs artifacts/ || true
          # copy build outputs if present
          if compgen -G "build/app/outputs/flutter-apk/*.apk" > /dev/null; then
            cp build/app/outputs/flutter-apk/*.apk artifacts/ || true
          fi
          if compgen -G "build/app/outputs/bundle/release/*.aab" > /dev/null; then
            cp build/app/outputs/bundle/release/*.aab artifacts/ || true
          fi
          # zip full build folder as fallback
          if [ -d build ]; then
            zip -r artifacts/build-full.zip build || true
          fi
          echo "Artifacts prepared:"
          ls -la artifacts || true

      - name: Upload debug artifacts (logs + zips + any APK/AAB)
        uses: actions/upload-artifact@v4
        with:
          name: poultrypro-debug-artifacts
          path: artifacts/*

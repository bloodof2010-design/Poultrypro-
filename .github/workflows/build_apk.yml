name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Flutter --version
        run: flutter --version

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Android platform files exist (generate if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "android/ not found — generating Flutter platform files (temporary on runner)"
            flutter create -t app .
          else
            echo "android/ exists in repo"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (and bundle)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_apk.log || true
          flutter build appbundle --release 2>&1 | tee build_aab.log || true

      - name: Show build outputs (debug)
        run: |
          echo "Listing build/app/outputs/flutter-apk:"
          ls -la build/app/outputs/flutter-apk || true
          echo
          echo "Listing build/app/outputs/bundle/release:"
          ls -la build/app/outputs/bundle/release || true
          echo
          echo "Find any .apk or .aab under build/:"
          find build -type f \( -name "*.apk" -o -name "*.aab" \) -print || true
          echo
          echo "Show sizes for build dir:"
          du -sh build || true

      - name: Package release outputs (zip everything safe)
        run: |
          mkdir -p artifacts
          if compgen -G "build/app/outputs/flutter-apk/*.apk" > /dev/null; then
            cp build/app/outputs/flutter-apk/*.apk artifacts/ || true
          fi
          if compgen -G "build/app/outputs/bundle/release/*.aab" > /dev/null; then
            cp build/app/outputs/bundle/release/*.aab artifacts/ || true
          fi
          zip -r artifacts/build-output.zip build || true
          ls -la artifacts

      - name: Upload artifact (all found APK/AAB + zip)
        uses: actions/upload-artifact@v4
        with:
          name: poultrypro-release-artifacts
          path: artifacts/*

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Flutter --version
        run: flutter --version

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Android platform files exist (generate if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "android/ not found — generating Flutter platform files (temporary on runner)"
            flutter create -t app .
          else
            echo "android/ exists in repo"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Show built APKs (debug)
        run: |
          echo "Listing build/app/outputs/flutter-apk:"
          ls -la build/app/outputs/flutter-apk || true
          echo
          echo "Find any .apk under build/:"
          find build -type f -name "*.apk" -print || true

      - name: Upload APK artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: poultrypro-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/**/outputs/**/*.apk
